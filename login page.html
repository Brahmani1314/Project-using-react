<html>
    <head>
        <title> My First HTML Page </title>
        <style>
          body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
          }
          #div1 {
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
          }
          input[type="text"], input[type="password"] {
            margin: 8px 0;
            padding: 6px;
            width: 180px;
          }
          .container {
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            text-align: center;
          }
          #uploadSection {
            display: none; /* hidden until login */
          }
          #result {
            margin-top: 10px;
            color: green;
            font-weight: bold;
            display: none;
          }
        </style>
        <script>
           function fun1 () {
            var a = document.getElementById("un").value;
            var b = document.getElementById("pw").value;
            alert(a + " --- " + b);
            document.getElementById("new").innerHTML = "Login successful";

            // Hide login box, show upload section
            document.getElementById("div1").style.display = "none";
            document.getElementById("uploadSection").style.display = "block";
           }

           function submitForm() {
             document.getElementById("result").style.display = "block";
           }
        </script>
    </head>
    <body>
        <!-- Login Box -->
        <center>
            <div id="div1">
                <p style="text-shadow: 1px 2px 4px yellow, -2px -2px 4px rgb(21, 102, 10);">
                    <b><i><u> Login Box </u></i></b>
                </p>
                <br/>
                <br/>
                username: <input type="text" id="un" />
                <br/>
                password: <input type="password" id="pw" />
                <br/>
                <br/>
                <button onclick="fun1()"> Login </button>
                <div id="new">  </div>
            </center>
        </div>

        <!-- Upload Section (shown only after login) -->
        <div id="uploadSection" class="container">
            <h2>Upload a File</h2>
            <form onsubmit="submitForm(); return false;">
                <input type="file" id="fileInput" required /><br/><br/>
                <button type="submit">Submit</button>
            </form>
            <div id="result">Submitted successfully!</div>
        </div>
    </body>
</html>
